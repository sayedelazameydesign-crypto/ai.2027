name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python when project metadata exists
        if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up Node.js when package metadata exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install Python tooling when project metadata exists
        if: hashFiles('pyproject.toml') != ''
        run: python -m pip install ruff mypy pytest

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f .env.example
          test -f docs/decisions.md
          test -d src
          test -d tests
          test -d config
          test -d prompts

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            npm run lint --if-present
          elif [[ -f pyproject.toml ]]; then
            python -m ruff check src tests
          else
            echo "No linter configured yet."
          fi

      - name: Type-check
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            npm run type-check --if-present
          elif [[ -f pyproject.toml ]]; then
            python -m mypy src
          else
            echo "No type checker configured yet."
          fi

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            npm test --if-present
          elif [[ -f pyproject.toml ]]; then
            python -m pytest -q
          else
            echo "No unit test runner configured yet."
          fi

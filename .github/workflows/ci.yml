name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md
          test -f .env.example
          test -f docs/decisions.md
          test -d src
          test -d tests
          test -d config
          test -d prompts
          echo "Repository structure is valid."

      - name: Run project checks when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            npm ci
            npm test --if-present
            npm run lint --if-present
          elif [[ -f pyproject.toml ]]; then
            python -m compileall -q src tests
            if command -v pytest >/dev/null 2>&1; then pytest -q; fi
          else
            echo "No language runtime configured yet; bootstrap checks passed."
          fi
